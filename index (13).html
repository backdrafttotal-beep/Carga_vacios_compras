<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<meta name="color-scheme" content="light dark">
<script>
  try{ if(localStorage.getItem("tema_app") === "claro") document.documentElement.classList.add("claro"); }catch(e){}
</script>
<title>Carga Vacíos Compras</title>
<style>
  :root{
    color-scheme:dark;
    --bg:#14171c; --bg-2:#171b21; --panel:#1c2129; --panel-2:#232a34; --line:#323a46;
    --amber:#e8a23d; --amber-dim:#7a5a26; --on-amber:#141414;
    --text:#eef1f5; --text-dim:#98a3b3; --green:#4caf7d; --red:#ff5a5a; --radius:10px;
  }
  html.claro{
    color-scheme:light;
    --bg:#f2f5f9; --bg-2:#ffffff; --panel:#ffffff; --panel-2:#e9edf3; --line:#c4cdd9;
    --amber:#9a4300; --amber-dim:#e3b574; --on-amber:#ffffff;
    --text:#000000; --text-dim:#242a33; --green:#1b7a4a; --red:#c01c1c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  body{padding-bottom:30px;}

  header{
    position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg,var(--bg-2),var(--bg) 90%);
    border-bottom:2px solid var(--amber-dim);padding:14px 16px 12px;padding-right:64px;
  }
  header h1{margin:0 0 2px;font-size:17px;font-weight:700;letter-spacing:.3px;}
  header .sub{font-size:12px;color:var(--text-dim);}
  .tema-btn{
    position:absolute;top:12px;right:14px;background:var(--panel-2);border:1px solid var(--line);
    border-radius:9px;color:var(--text);font-size:15px;line-height:1;padding:7px 10px;cursor:pointer;
  }

  .caja{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    margin:12px;padding:12px;}
  .prov-fila{display:flex;gap:8px;align-items:stretch;}
  .mic-btn{
    flex:none;width:54px;background:#1e7a45;border:1px solid #2fa060;border-radius:9px;
    color:#fff;font-size:20px;line-height:1;cursor:pointer;padding:0;
  }
  .mic-btn.listening{background:var(--red);border-color:var(--red);animation:pulsaMic 1s infinite;}
  @keyframes pulsaMic{0%,100%{opacity:1}50%{opacity:.55}}
  .escucha{
    display:none;position:fixed;left:12px;right:12px;bottom:14px;z-index:45;
    background:var(--panel-2);border:2px solid var(--amber);border-radius:11px;
    padding:10px 12px;align-items:center;justify-content:space-between;gap:10px;
    font-size:12.5px;font-weight:700;color:var(--text);box-shadow:0 8px 22px rgba(0,0,0,.35);
  }
  .escucha.show{display:flex;}
  .escucha-btn{
    flex:none;background:var(--amber);color:var(--on-amber);border:none;
    border-radius:8px;padding:9px 13px;font-size:12.5px;font-weight:800;cursor:pointer;
  }
  #prov{
    flex:1;min-width:0;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;
    color:var(--text);padding:12px 10px;font-size:16px;font-weight:800;letter-spacing:.3px;
  }
  #prov:focus{outline:none;border-color:var(--amber);}
  .caja h2{margin:0 0 10px;font-size:11.5px;letter-spacing:.6px;color:var(--amber);
    text-transform:uppercase;font-weight:800;}

  /* ---- el camión ---- */
  .camion{
    position:relative;display:flex;height:66px;border:2px solid var(--line);
    border-radius:8px;overflow:hidden;background:var(--panel-2);
  }
  .bloque{
    position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
    border-right:1px solid rgba(0,0,0,.35);min-width:0;overflow:hidden;
  }
  .bloque b{font-size:11px;font-weight:800;color:#10141a;line-height:1.1;}
  .bloque span{font-size:9.5px;font-weight:700;color:#10141a;opacity:.8;}
  .bloque.mini b{display:none;}
  .bloque.mini span{font-size:12px;font-weight:800;opacity:1;}
  .bloque.micro b, .bloque.micro span{display:none;}
  .bloque.libre{background:repeating-linear-gradient(45deg,var(--panel-2),var(--panel-2) 6px,var(--line) 6px,var(--line) 12px);}
  .bloque.libre b{color:var(--text-dim);font-size:10px;}
  .resumen{display:flex;gap:10px;margin-top:10px;font-size:12px;color:var(--text-dim);flex-wrap:wrap;}
  .resumen b{display:block;color:var(--text);font-size:16px;}
  .resumen .ok b{color:var(--green);}
  .resumen .hueco b{color:var(--amber);}

  /* ---- lista de referencias ---- */
  table{width:100%;border-collapse:separate;border-spacing:0;}
  th{font-size:10px;letter-spacing:.5px;color:var(--text-dim);text-transform:uppercase;
    text-align:left;padding:0 4px 6px;font-weight:800;}
  th.n, td.n{text-align:right;width:92px;}
  td{border-top:1px solid var(--line);padding:7px 4px;vertical-align:middle;}
  td.ref{font-size:13.5px;font-weight:800;letter-spacing:.3px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  td.ref small{display:block;font-family:inherit;font-size:11px;font-weight:600;
    letter-spacing:0;color:var(--text-dim);margin-top:2px;}
  .medidas{font-size:11px;color:var(--amber);font-weight:700;}
  tr.sinmed .medidas{color:var(--red);}
  tr.sinmed .stepper input, tr.sinmed .stepper button{opacity:.4;}
  .stepper{display:flex;align-items:center;justify-content:flex-end;gap:5px;}
  .stepper button{
    width:30px;height:32px;border:1px solid var(--line);background:var(--panel-2);
    color:var(--text);border-radius:7px;font-size:17px;line-height:1;cursor:pointer;padding:0;
  }
  .stepper input{
    width:46px;height:32px;text-align:center;border:1px solid var(--line);border-radius:7px;
    background:var(--panel-2);color:var(--text);font-size:15px;font-weight:800;padding:0;
  }
  .stepper input:focus{outline:none;border-color:var(--amber);}
  tr.usada td{background:rgba(232,162,61,.07);}

  /* ---- plan ---- */
  .col{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line);}
  .col:last-child{border-bottom:none;}
  .pastilla{flex:none;width:12px;height:34px;border-radius:3px;}
  .col .txt{flex:1;min-width:0;font-size:13px;line-height:1.35;}
  .col .txt b{font-size:13.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.3px;}
  .col .txt span{display:block;font-size:11.5px;color:var(--text-dim);}
  .col .txt span.pilas{color:var(--amber);font-weight:700;margin-top:2px;}
  .col .pz{flex:none;text-align:right;font-size:15px;font-weight:800;}
  .col .pz small{display:block;font-size:10px;color:var(--text-dim);font-weight:700;}
  .vacio{font-size:13px;color:var(--text-dim);line-height:1.5;}
  .sobran{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:12px;color:var(--text-dim);line-height:1.6;}
  .sobran b{color:var(--text);}

  .btn-fila{display:flex;gap:8px;margin:0 12px;}
  .btn{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:11px;font-size:13px;font-weight:700;cursor:pointer;}
  .btn-amber{background:var(--amber);color:var(--on-amber);border-color:transparent;}

  .anadir{display:none;}
  .anadir.abierta{display:block;}
  .campo{margin-bottom:9px;}
  .campo label{display:block;font-size:10.5px;letter-spacing:.4px;color:var(--text-dim);
    text-transform:uppercase;font-weight:800;margin-bottom:4px;}
  .campo input{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;
    color:var(--text);padding:10px;font-size:14px;}
  .campo input:focus{outline:none;border-color:var(--amber);}
  .dos{display:flex;gap:9px;}
  .dos .campo{flex:1;}
  .nota{font-size:11.5px;color:var(--text-dim);line-height:1.5;margin:8px 0 0;}

  .toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
    background:var(--panel-2);border:1px solid var(--amber-dim);color:var(--text);
    padding:10px 18px;border-radius:20px;font-size:12.5px;font-weight:700;
    opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:40;max-width:88%;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<header>
  <button class="tema-btn" id="temaBtn" aria-label="Cambiar fondo">&#9728;&#65039;</button>
  <h1>Carga Vacíos Compras</h1>
  <div class="sub" id="subt">Mega 13,59 m &middot; 2 contenedores de ancho &middot; <b>v06-11</b></div>
</header>

<div class="caja">
  <h2>Camión para</h2>
  <div class="prov-fila">
    <select id="prov"></select>
    <button class="mic-btn" id="micBtn" title="Decir referencia y cantidad">&#127908;</button>
  </div>
</div>

<div class="caja">
  <h2>Cómo queda el camión</h2>
  <div class="camion" id="camion"></div>
  <div class="resumen" id="resumen"></div>
</div>

<div class="caja">
  <h2>Qué cargar</h2>
  <div id="plan"></div>
</div>

<div class="caja">
  <h2>Contenedores vacíos que tienes</h2>
  <table>
    <thead><tr><th>Referencia</th><th class="n">Tienes</th></tr></thead>
    <tbody id="lista"></tbody>
  </table>
  <p class="nota" id="notaStack"></p>
</div>

<div class="btn-fila">
  <button class="btn" id="vaciarBtn">&#128465; Poner a cero</button>
</div>


<div class="escucha" id="escuchaBar">
  <span id="escuchaTxt">Escuchando…</span>
  <button class="escucha-btn" id="escuchaParar">Parar</button>
</div>

<div class="toast" id="toast"></div>

<script>
// ---------- EL CAMIÓN ----------
// Mega: 13.590 x 2.480 x 3.020 mm. De ancho entran dos contenedores de 120,
// así que el camión son 1.359 cm de largo con dos carriles.
const CAMION = { largo:1359, ancho:248, alto:302, carriles:2 };

// ---------- CONTENEDORES POR PROVEEDOR ----------
// Solo los de COMPRAS: los del JIT (KWD, GESTAMP, NEINSA, AISA) no entran aquí.
// Las referencias salen de CARGA VACÍOS del almacén. Las medidas que faltan se
// ponen desde la propia app (lápiz en la fila) y se quedan guardadas.
const PROVEEDORES = [
  { name:"MAGNA", refs:[
    { ref:"2F0 801 251/2", den:"Talonera" },
    { ref:"2F0 803 141", den:"Pedalera" }
  ]},
  { name:"ZONA FRANCA", refs:[
    { ref:"2F0 803 155", den:"Salpicadero", largo:180, alto:145 },
    { ref:"2F0 813 113", den:"Piso posterior", largo:180, alto:125 },
    { ref:"2Q1 803 155", den:"Salpicadero Izq", largo:140, alto:148 },
    { ref:"2Q2 803 155", den:"Salpicadero Dch", largo:140, alto:148 },
    { ref:"2Q1 805 265", den:"Caja de aguas Izq", largo:180, alto:148 },
    { ref:"2Q2 805 265", den:"Caja de aguas Dch", largo:180, alto:148 },
    { ref:"2F0 802 851", den:"", largo:100, alto:75 },
    { ref:"2F0 802 852", den:"", largo:100, alto:75 },
    { ref:"2F0 804 789", den:"", largo:100, alto:75 },
    { ref:"2F0 804 790", den:"", largo:100, alto:75 }
  ]},
  { name:"SEAT MARTORELL", refs:[
    { ref:"2F0 805 265", den:"Caja de aguas" },
    { ref:"2F0 803 205", den:"Piso anterior" },
    { ref:"2Q0 803 205 B", den:"Piso anterior" }
  ]},
  { name:"MELEGHY", refs:[
    { ref:"2F0 813 759", den:"Placa refuerzo" },
    { ref:"2Q0 803 531A", den:"Traviesa" },
    { ref:"2GM 802 483", den:"" }
  ]},
  { name:"ABRERA", refs:[
    { ref:"2Q0 803 144", den:"Pedalera" }
  ]}
];

const COLORES = ["#e8c33d","#4fb3e8","#b06fd8","#e8903d","#5ec98a","#e85d5d","#8f9ae0","#d8b06f"];

const STORAGE_KEY = "carga_camion_v1";
let state = { prov:"ZONA FRANCA", tengo:{} };

let STORAGE_OK = false;
(function(){
  try{
    const p = STORAGE_KEY + "__probe";
    localStorage.setItem(p,"1"); STORAGE_OK = localStorage.getItem(p) === "1"; localStorage.removeItem(p);
  }catch(e){ STORAGE_OK = false; }
})();
function save(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){} }
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
    if(s && typeof s === "object"){
      if(s.tengo) state.tengo = s.tengo;
      if(s.prov && PROVEEDORES.concat([{name:s.prov}]).some(p=>p.name===s.prov)) state.prov = s.prov;
    }
    if(!PROVEEDORES.some(p=> p.name === state.prov)) state.prov = PROVEEDORES[0].name;
  }catch(e){}
}
window.addEventListener("pagehide", save);
window.addEventListener("beforeunload", save);

// Las piezas del proveedor elegido, con las medidas que hayas puesto tú.
function piezas(){
  const p = PROVEEDORES.find(x=> x.name === state.prov);
  // Las medidas van fijas en la aplicación: no se tocan desde el teléfono,
  // para que no haya errores en las cargas.
  return p ? p.refs : [];
}
function conMedidas(){ return piezas().filter(p=> p.largo > 0 && p.alto > 0); }
function claveTengo(ref){ return state.prov + "|" + ref; }
function tengoDe(ref){ return parseInt(state.tengo[claveTengo(ref)], 10) || 0; }

// ---------- AVISOS Y FONDO ----------
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(showToast._h);
  showToast._h = setTimeout(()=> t.classList.remove("show"), 2600);
}
const TEMA_KEY = "tema_app";
let tema = "oscuro";
try{ tema = localStorage.getItem(TEMA_KEY) || "oscuro"; }catch(e){}
function aplicarTema(){
  const claro = tema === "claro";
  document.documentElement.classList.toggle("claro", claro);
  document.getElementById("temaBtn").textContent = claro ? "\u{1F319}" : "☀️";
}
aplicarTema();
document.getElementById("temaBtn").addEventListener("click", ()=>{
  tema = (tema === "claro") ? "oscuro" : "claro";
  try{ localStorage.setItem(TEMA_KEY, tema); }catch(e){}
  aplicarTema();
});

// ---------- EL CÁLCULO ----------
// Los que miden lo mismo comparten columna: en el camión se apilan juntos
// aunque sean referencias distintas (los cuatro de 100x75, por ejemplo).
// Los contenedores del mismo LARGO comparten hueco, aunque sean de distinto
// alto: lo que sobra de uno se apila encima de otro mientras entre en los
// 3,02 m. Es el "pico con pico" de toda la vida.
function apilar(items){
  const pilas = [];
  items.slice().sort((a,b)=> b.alto - a.alto).forEach(it=>{
    let p = null;
    for(let i = 0; i < pilas.length; i++){
      if(pilas[i].libre >= it.alto){ p = pilas[i]; break; }
    }
    if(!p){ p = { libre:CAMION.alto, items:[] }; pilas.push(p); }
    p.libre -= it.alto;
    p.items.push(it);
  });
  return pilas;
}
function formatos(){
  const map = {};
  conMedidas().forEach((p, idx)=>{
    const n = tengoDe(p.ref);
    if(!n) return;
    if(!map[p.largo]) map[p.largo] = { largo:p.largo, total:0, items:[], refs:[], orden:idx };
    const g = map[p.largo];
    g.total += n;
    g.refs.push({ ref:p.ref, den:p.den, n:n, alto:p.alto });
    for(let i = 0; i < n; i++) g.items.push({ ref:p.ref, alto:p.alto });
  });
  return Object.keys(map).map(k=>{
    const g = map[k];
    g.pilas = apilar(g.items);
    g.maxCols = Math.ceil(g.pilas.length / CAMION.carriles);
    return g;
  }).filter(g=> g.largo <= CAMION.largo && g.pilas.length)
    .sort((a,b)=> b.largo - a.largo || a.orden - b.orden);
}
// Cuántas piezas entran si a ese largo le doy c huecos (2 pilas por hueco).
function piezasEn(g, c){
  const n = Math.min(g.pilas.length, c * CAMION.carriles);
  let s = 0;
  for(let i = 0; i < n; i++) s += g.pilas[i].items.length;
  return s;
}

// Reparte el largo del camión entre columnas para que sobre lo menos posible.
function planificar(fmts){
  const L = CAMION.largo;
  let dp = new Array(L + 1).fill(null);
  dp[0] = { piezas:0, cols:[] };
  fmts.forEach((f, i)=>{
    const sig = dp.slice();
    for(let cm = 0; cm <= L; cm++){
      if(!dp[cm]) continue;
      for(let c = 1; c <= f.maxCols; c++){
        const nl = cm + c * f.largo;
        if(nl > L) break;
        const pz = dp[cm].piezas + piezasEn(f, c);
        if(!sig[nl] || pz > sig[nl].piezas){
          sig[nl] = { piezas:pz, cols: dp[cm].cols.concat([{ i:i, c:c }]) };
        }
      }
    }
    dp = sig;
  });
  for(let cm = L; cm >= 0; cm--){
    if(dp[cm]) return { usado:cm, piezas:dp[cm].piezas, cols:dp[cm].cols };
  }
  return { usado:0, piezas:0, cols:[] };
}

// Convierte el plan en columnas de verdad, repartiendo las piezas por referencia.
function detallar(fmts, plan){
  const fuera = [];
  const cargadas = {};
  plan.cols.forEach(sel=>{
    const g = fmts[sel.i];
    const nPilas = Math.min(g.pilas.length, sel.c * CAMION.carriles);
    const porRef = {}, formas = {};
    let piezas = 0;
    for(let i = 0; i < nPilas; i++){
      const pila = g.pilas[i];
      piezas += pila.items.length;
      // cómo es esa pila, para contar cuántas iguales salen
      const clave = pila.items.map(x=> x.ref).sort().join(" + ");
      formas[clave] = (formas[clave] || 0) + 1;
      pila.items.forEach(x=>{
        porRef[x.ref] = (porRef[x.ref] || 0) + 1;
        cargadas[x.ref] = (cargadas[x.ref] || 0) + 1;
      });
    }
    fuera.push({ f:g, cols:sel.c, pilas:nPilas, piezas:piezas, porRef:porRef, formas:formas, i:sel.i });
  });
  return { columnas:fuera, cargadas:cargadas };
}

// ---------- PINTAR ----------
const camionEl = document.getElementById("camion");
const resumenEl = document.getElementById("resumen");
const planEl = document.getElementById("plan");
// "2F0 803 155" -> "2F0·155": con los tres primeros se distingue del 2Q1
function corto(ref){
  const r = String(ref).replace(/\s+/g,"");
  return r.length > 6 ? (r.slice(0,3) + "\u00b7" + r.slice(-3)) : r;
}

function render(){
  provEl.value = state.prov;
  // la lista de referencias
  document.getElementById("lista").innerHTML = piezas().map(p=>{
    const n = tengoDe(p.ref);
    const tiene = p.largo > 0 && p.alto > 0;
    return `<tr class="${n ? "usada" : ""}${tiene ? "" : " sinmed"}">
      <td class="ref">${p.ref}
        <small>${p.den ? p.den + " · " : ""}<span class="medidas">${
          tiene ? `${p.largo} × 120 × ${p.alto} cm` : "medidas pendientes"}</span></small>
      </td>
      <td class="n">
        <div class="stepper">
          <button data-menos="${p.ref}" ${tiene ? "" : "disabled"}>−</button>
          <input type="number" inputmode="numeric" min="0" data-ref="${p.ref}"
            value="${n || ""}" placeholder="0" ${tiene ? "" : "disabled"}>
          <button data-mas="${p.ref}" ${tiene ? "" : "disabled"}>+</button>
        </div>
      </td>
    </tr>`;
  }).join("");

  const fmts = formatos();
  const plan = planificar(fmts);
  const det = detallar(fmts, plan);
  const libre = CAMION.largo - plan.usado;

  // el dibujo del camión
  if(!det.columnas.length){
    camionEl.innerHTML = `<div class="bloque libre" style="flex:1 1 100%"><b>camión vacío</b></div>`;
  }else{
    let html = "";
    det.columnas.forEach(c=>{
      const ancho = (c.f.largo * c.cols) / CAMION.largo * 100;
      // en los bloques estrechos no cabe el texto: se deja solo el número
      const clase = ancho < 6 ? "bloque micro" : (ancho < 11 ? "bloque mini" : "bloque");
      html += `<div class="bloque ${clase.replace("bloque","").trim()}" style="flex:0 0 ${ancho}%;background:${COLORES[c.i % COLORES.length]}">
        <b>${corto(c.f.refs[0].ref)}</b><span>${c.piezas} pz</span></div>`;
    });
    if(libre > 0){
      html += `<div class="bloque libre" style="flex:0 0 ${libre / CAMION.largo * 100}%"><b>${libre}</b></div>`;
    }
    camionEl.innerHTML = html;
  }

  resumenEl.innerHTML =
    `<div class="ok"><b>${plan.piezas}</b>contenedores</div>` +
    `<div><b>${(plan.usado/100).toFixed(2).replace(".",",")} m</b>ocupados de 13,59</div>` +
    `<div class="hueco"><b>${(libre/100).toFixed(2).replace(".",",")} m</b>libres</div>`;

  // qué cargar
  if(!det.columnas.length){
    const sinMed = piezas().filter(p=> tengoDe(p.ref) && !(p.largo > 0 && p.alto > 0));
    planEl.innerHTML = sinMed.length
      ? `<div class="vacio">Faltan las medidas de <b>${sinMed.map(p=>p.ref).join(" · ")}</b>.</div>`
      : `<div class="vacio">Dime abajo cuántos contenedores vacíos tienes de cada
         referencia y aquí te digo qué meter para aprovechar el camión.</div>`;
  }else{
    planEl.innerHTML = det.columnas.map(c=>{
      const refs = Object.keys(c.porRef).map(r=> `${corto(r)} × ${c.porRef[r]}`).join(" · ");
      // cómo se apila: "3 pilas de 2Q1·265 + 2Q1·265", "1 pila de 2Q1·265 + 2F0·113"
      const pilas = Object.keys(c.formas).map(k=>{
        const n = c.formas[k];
        const comp = k.split(" + ").map(corto).join(" + ");
        return `${n} ${n === 1 ? "pila" : "pilas"} de ${comp}`;
      }).join(" · ");
      return `<div class="col">
        <div class="pastilla" style="background:${COLORES[c.i % COLORES.length]}"></div>
        <div class="txt"><b>${c.f.refs.map(r=>r.ref).join(" / ")}</b>
          <span>${c.cols} ${c.cols === 1 ? "hueco" : "huecos"} de ${c.f.largo} cm · ${refs}</span>
          <span class="pilas">${pilas}</span></div>
        <div class="pz">${c.piezas}<small>piezas</small></div>
      </div>`;
    }).join("");

    // lo que no cabe
    const sobra = [];
    conMedidas().forEach(p=>{
      const resto = tengoDe(p.ref) - (det.cargadas[p.ref] || 0);
      if(resto > 0) sobra.push(`${p.ref} × ${resto}`);
    });
    let pie = "";
    const sinMed = piezas().filter(p=> tengoDe(p.ref) && !(p.largo > 0 && p.alto > 0));
    if(sinMed.length){
      pie += `Sin medidas, no las puedo colocar: <b>${sinMed.map(p=>p.ref).join(" · ")}</b>.
        Están pendientes de medir.`;
    }
    if(sobra.length) pie += (pie ? "<br>" : "") + `Se quedan en tierra: <b>${sobra.join(" · ")}</b>.`;
    if(libre > 0){
      const cabe = formatos().filter(f=> f.largo <= libre);
      pie += (pie ? "<br>" : "") + (cabe.length
        ? `Sobran ${libre} cm: todavía entraría otro hueco de ${Math.min.apply(null, cabe.map(f=>f.largo))} cm si tuvieras más.`
        : `Sobran ${libre} cm, pero no da para otro hueco: el más corto que manejas mide ${
            Math.min.apply(null, piezas().map(p=>p.largo))} cm.`);
    }else{
      pie += (pie ? "<br>" : "") + "Camión lleno al centímetro.";
    }
    planEl.innerHTML += `<div class="sobran">${pie}</div>`;
  }

  // nota de apilado
  const alturas = {};
  conMedidas().forEach(p=>{ alturas[p.alto] = Math.floor(CAMION.alto / p.alto); });
  document.getElementById("notaStack").innerHTML = !Object.keys(alturas).length
    ? "Este proveedor todavía no tiene medidas: pásame su hoja de EasyCargo y se las meto."
    : "Cada hueco del camión son dos pilas de hasta 3,02 m. En una pila se pueden " +
      "juntar contenedores distintos mientras sumen 302 cm o menos: " +
      Object.keys(alturas).sort((a,b)=>b-a).map(h=> `los de ${h} van de ${alturas[h]} en ${alturas[h]}`).join(", ") +
      ", y los picos que sobren se montan unos encima de otros.";
}

// ---------- DECIR LA CANTIDAD ----------
const WORD_NUM = {
  "cero":0,"uno":1,"una":1,"dos":2,"tres":3,"cuatro":4,"cinco":5,"seis":6,"siete":7,"ocho":8,"nueve":9,
  "diez":10,"once":11,"doce":12,"trece":13,"catorce":14,"quince":15,
  "dieciseis":16,"diecisiete":17,"dieciocho":18,"diecinueve":19,
  "veinte":20,"veintiuno":21,"veintidos":22,"veintitres":23,"veinticuatro":24,"veinticinco":25,
  "veintiseis":26,"veintisiete":27,"veintiocho":28,"veintinueve":29,
  "treinta":30,"cuarenta":40,"cincuenta":50,"sesenta":60,"setenta":70,"ochenta":80,"noventa":90,
  "cien":100,"ciento":100,"doscientos":200,"trescientos":300,"cuatrocientos":400,"quinientos":500,
  "seiscientos":600,"setecientos":700,"ochocientos":800,"novecientos":900
};
function parseSpokenNumber(transcript){
  const tokens = transcript.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9\s]/g," ").split(/\s+/).filter(Boolean);
  const groups = [];
  let current = null, pendingY = false;
  tokens.forEach(tok=>{
    if(tok === "y"){ pendingY = true; return; }
    let val = null;
    if(/^\d+$/.test(tok)) val = parseInt(tok,10);
    else if(tok in WORD_NUM) val = WORD_NUM[tok];
    if(val !== null){
      const canAdd = current !== null && (pendingY || (current>=100 && current%100===0));
      if(canAdd) current += val;
      else{ if(current!==null) groups.push(String(current)); current = val; }
      pendingY = false;
      return;
    }
    if(/^[a-e]$/.test(tok)){
      if(current!==null){ groups.push(String(current)); current=null; }
      groups.push(tok.toUpperCase());
      pendingY = false;
      return;
    }
    if(current!==null){ groups.push(String(current)); current=null; }
    pendingY = false;
  });
  if(current!==null) groups.push(String(current));
  return groups.join("");
}
function cleanRefVoice(s){ return String(s||"").toUpperCase().replace(/[^A-Z0-9]/g,""); }

// ---------- DECIR LA PIEZA POR SU NOMBRE ----------
// Además de los dígitos, vale cantar la denominación: "piso verde",
// "bombo pequeño", "piso amarillo", "bombo grande"...
function normVoz(s){
  return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]+/g," ").trim();
}
const SINONIMOS_VOZ = {
  chico:"pequeno", chica:"pequeno", pequena:"pequeno", pequenito:"pequeno",
  grandes:"grande", gordo:"grande", gorda:"grande",
  verdes:"verde", amarilla:"amarillo", amarillas:"amarillo",
  izquierda:"izq", izquierdo:"izq", derecha:"dch", derecho:"dch",
};
const RELLENO_VOZ = ["por","con","una","uno","del","los","las","que","para","referencia","contenedor","numero","pieza","piezas"];
function palabrasVoz(t){
  return normVoz(t).split(" ")
    .filter(w=> w.length >= 3 && RELLENO_VOZ.indexOf(w) === -1)
    .map(w=> SINONIMOS_VOZ[w] || w);
}
// Vale si todas las palabras dichas están en la denominación de la pieza.
function buscarPorDenominacion(items, txt){
  const pal = palabrasVoz(txt);
  if(!pal.length) return [];
  return (items || []).filter(it=>{
    const den = normVoz(it.den);
    return den && pal.every(w=> den.indexOf(w) !== -1);
  });
}

// "113 cantidad 2" -> { ref:"113", qty:2 }.  Valen cantidad, unidades, piezas,
// por y equis, y también "ciento trece cantidad dos".
const PALABRA_CANTIDAD = /\b(cantidad(?:es)?|unidades|unidad|piezas|pieza|por|equis|x)\b/;
function partirRefCantidad(transcript){
  const t = String(transcript||"").toLowerCase().normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9\s]/g," ");
  const m = t.match(PALABRA_CANTIDAD);
  if(!m) return { refTxt: transcript, qty: null };
  const antes = t.slice(0, m.index);
  const despues = t.slice(m.index + m[0].length);
  const qtyTxt = parseSpokenNumber(despues).replace(/[^0-9]/g, "");
  if(!antes.trim() || !qtyTxt) return { refTxt: transcript, qty: null };
  return { refTxt: antes, qty: parseInt(qtyTxt, 10) };
}
function refVariantsVoice(ref){
  const m = String(ref||"").match(/^(.*?)(\d+)\s*\/\s*(\d+)\s*$/);
  if(!m) return [cleanRefVoice(ref)];
  const prefix = m[1], num1 = m[2], suf2 = m[3];
  const num2 = num1.slice(0, Math.max(0, num1.length - suf2.length)) + suf2;
  return [cleanRefVoice(prefix + num1), cleanRefVoice(prefix + num2)];
}
// Busca la pieza dicha dentro del proveedor que esté puesto.
function buscarPieza(refTxt){
  const items = conMedidas();
  const parsed = cleanRefVoice(parseSpokenNumber(refTxt));
  let m = [];
  if(parsed){
    m = items.filter(it=> refVariantsVoice(it.ref).includes(parsed));
    if(!m.length && parsed.length >= 3){
      m = items.filter(it=> refVariantsVoice(it.ref).some(v=> v.endsWith(parsed)));
    }
  }
  if(!m.length) m = buscarPorDenominacion(items, refTxt);
  return m;
}

const SRCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
let escuchando = false, dictadas = 0, rec = null;
const micBtn = document.getElementById("micBtn");
const escuchaBar = document.getElementById("escuchaBar");
const escuchaTxt = document.getElementById("escuchaTxt");

function pintarEscucha(){
  escuchaTxt.textContent = dictadas
    ? "Escuchando… \u00b7 " + dictadas + (dictadas === 1 ? " apuntada" : " apuntadas")
    : "Escuchando… di \"155 cantidad 20\"";
}
function pararEscucha(aviso){
  escuchando = false;
  try{ rec && rec.stop(); }catch(e){}
  micBtn.classList.remove("listening");
  escuchaBar.classList.remove("show");
  if(aviso !== false && dictadas) showToast(dictadas + (dictadas === 1 ? " cantidad apuntada" : " cantidades apuntadas"));
  dictadas = 0;
}
function arrancarEscucha(){
  escuchando = true; dictadas = 0;
  micBtn.classList.add("listening");
  escuchaBar.classList.add("show");
  pintarEscucha();
  try{ rec.start(); }catch(e){}
}

// Procesa una frase: "155 cantidad 20". Devuelve true si la apuntó.
function apuntarDictado(frase){
  const { refTxt, qty } = partirRefCantidad(frase);
  if(qty === null) return false;
  const m = buscarPieza(refTxt);
  if(!m.length) return false;
  const it = m[0];
  state.tengo[claveTengo(it.ref)] = Math.max(0, qty);
  save(); render();
  const fila = document.querySelector(`input[data-ref="${it.ref}"]`);
  if(fila && fila.scrollIntoView) try{ fila.scrollIntoView({ behavior:"smooth", block:"center" }); }catch(e){}
  dictadas++; pintarEscucha();
  showToast((m.length > 1 ? "Varias coinciden \u00b7 " : "") + it.ref + " = " + qty);
  return true;
}

if(SRCtor){
  rec = new SRCtor();
  rec.lang = "es-ES";
  rec.continuous = true;
  rec.interimResults = false;
  rec.maxAlternatives = 3;
  rec.addEventListener("end", ()=>{
    // el móvil corta solo al callar: si no hemos parado, se vuelve a arrancar
    if(escuchando){ setTimeout(()=>{ if(escuchando){ try{ rec.start(); }catch(e){} } }, 250); return; }
    micBtn.classList.remove("listening");
  });
  rec.addEventListener("error", (ev)=>{
    if(escuchando && ev && (ev.error === "no-speech" || ev.error === "aborted")) return;
    const msg = (ev && ev.error === "not-allowed")
      ? "El micrófono está bloqueado · permítelo en el navegador"
      : "El micrófono no funciona así (archivo suelto) · abre la app desde su enlace";
    pararEscucha(false);
    showToast(msg);
  });
  rec.addEventListener("result", (e)=>{
    for(let i = e.resultIndex; i < e.results.length; i++){
      const res = e.results[i];
      if(!res.isFinal) continue;
      let hecho = false;
      for(let a = 0; a < res.length && !hecho; a++) hecho = apuntarDictado(res[a].transcript);
      if(!hecho) showToast("No he entendido \"" + res[0].transcript + "\"");
    }
  });
  micBtn.addEventListener("click", ()=> escuchando ? pararEscucha() : arrancarEscucha());
  document.getElementById("escuchaParar").addEventListener("click", ()=> pararEscucha());
}else{
  micBtn.addEventListener("click", ()=>
    showToast("Este navegador no tiene micrófono: usa el de tu teclado sobre la casilla"));
}

// ---------- PROVEEDOR ----------
const provEl = document.getElementById("prov");
provEl.innerHTML = PROVEEDORES.map(p=>
  `<option value="${p.name}">${p.name}</option>`).join("");
provEl.addEventListener("change", ()=>{
  if(typeof pararEscucha === "function" && escuchando) pararEscucha(false);
  state.prov = provEl.value;
  save(); render();
  window.scrollTo(0,0);
});

// ---------- TOCAR LA LISTA ----------
document.getElementById("lista").addEventListener("click", e=>{
  const mas = e.target.closest("[data-mas]"), menos = e.target.closest("[data-menos]");
  if(!mas && !menos) return;
  const ref = (mas || menos).dataset.mas || (mas || menos).dataset.menos;
  const n = tengoDe(ref) + (mas ? 1 : -1);
  state.tengo[claveTengo(ref)] = Math.max(0, n);
  save(); render();
});
document.getElementById("lista").addEventListener("input", e=>{
  const inp = e.target.closest("input[data-ref]");
  if(!inp) return;
  state.tengo[claveTengo(inp.dataset.ref)] = Math.max(0, parseInt(inp.value, 10) || 0);
  save();
  const foco = inp.dataset.ref;
  render();
  const otra = document.querySelector(`input[data-ref="${foco}"]`);
  if(otra){ otra.focus(); try{ otra.setSelectionRange(otra.value.length, otra.value.length); }catch(err){} }
});

document.getElementById("vaciarBtn").addEventListener("click", ()=>{
  Object.keys(state.tengo).forEach(k=>{ if(k.indexOf(state.prov + "|") === 0) delete state.tengo[k]; });
  save(); render();
  showToast("Puesto a cero");
});

// ---------- ARRANQUE ----------
load();
if(!STORAGE_OK){
  document.getElementById("subt").innerHTML = "⚠️ ESTE NAVEGADOR NO GUARDA LOS DATOS";
}
render();
</script>
